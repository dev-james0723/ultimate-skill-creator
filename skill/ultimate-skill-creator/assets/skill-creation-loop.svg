<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate Skill Creator loop</title>
  <desc id="desc">A reusable loop: solve, capture, package, validate, publish, and improve.</desc>
  <rect width="1280" height="720" fill="#fffdf7"/>
  <text x="64" y="80" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Ultimate Skill Creator</text>
  <text x="64" y="122" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">Turn a hard-won solution into a clean skill package others can reuse.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="74" y="220" width="190" height="150" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="106" y="260" font-size="24" font-weight="700" fill="#1e3a8a">1. Solve</text>
    <text x="106" y="304" font-size="17" fill="#334155">Understand goal,</text>
    <text x="106" y="330" font-size="17" fill="#334155">constraints, and</text>
    <text x="106" y="356" font-size="17" fill="#334155">real failures.</text>

    <rect x="324" y="220" width="190" height="150" rx="18" fill="#ecfdf5" stroke="#86efac"/>
    <text x="356" y="260" font-size="24" font-weight="700" fill="#166534">2. Capture</text>
    <text x="356" y="304" font-size="17" fill="#334155">Save evidence,</text>
    <text x="356" y="330" font-size="17" fill="#334155">commands, logic,</text>
    <text x="356" y="356" font-size="17" fill="#334155">and boundaries.</text>

    <rect x="574" y="220" width="190" height="150" rx="18" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="606" y="260" font-size="24" font-weight="700" fill="#6b21a8">3. Package</text>
    <text x="606" y="304" font-size="17" fill="#334155">SKILL.md, refs,</text>
    <text x="606" y="330" font-size="17" fill="#334155">scripts, assets,</text>
    <text x="606" y="356" font-size="17" fill="#334155">metadata.</text>

    <rect x="824" y="220" width="190" height="150" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="856" y="260" font-size="24" font-weight="700" fill="#9a3412">4. Validate</text>
    <text x="856" y="304" font-size="17" fill="#334155">Run validators,</text>
    <text x="856" y="330" font-size="17" fill="#334155">script checks,</text>
    <text x="856" y="356" font-size="17" fill="#334155">and repair.</text>

    <rect x="1074" y="220" width="150" height="150" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1100" y="260" font-size="24" font-weight="700" fill="#5b21b6">5. Publish</text>
    <text x="1100" y="304" font-size="17" fill="#334155">Ask first.</text>
    <text x="1100" y="330" font-size="17" fill="#334155">Push only</text>
    <text x="1100" y="356" font-size="17" fill="#334155">after OK.</text>
  </g>

  <path d="M274 295 H312" stroke="#0f172a" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
  <path d="M524 295 H562" stroke="#0f172a" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
  <path d="M774 295 H812" stroke="#0f172a" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
  <path d="M1024 295 H1062" stroke="#0f172a" stroke-width="6" marker-end="url(#arrow)" fill="none"/>
  <path d="M1148 396 C1148 580 170 580 170 396" stroke="#2563eb" stroke-width="8" fill="none" marker-end="url(#arrow)"/>

  <rect x="154" y="486" width="972" height="88" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="194" y="528" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Publication rule</text>
  <text x="388" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155">Local candidate first. Validate locally. Confirm repo, visibility, branch, and push strategy before touching GitHub.</text>
</svg>
